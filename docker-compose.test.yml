services:
  postgres_test:
    image: postgres:17
    container_name: product_api_postgres_test

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test_password}
      POSTGRES_DB: product_test_db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d product_test_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      default:
        aliases:
          - postgres
