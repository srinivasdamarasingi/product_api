
name: Product API CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSE_PROJECT_NAME: product_api_ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.test.yml:docker-compose.ci.yml

      CONFIG_SOURCE: environment
      S3_BUCKET_NAME: ci-test-bucket
      AWS_REGION: us-east-1

      SMTP_HOST: localhost
      SMTP_PORT: "587"
      SMTP_USERNAME: ci-test-user
      SMTP_PASSWORD: ci-test-password
      MAIL_FROM: ci-test@example.com
      MAIL_FROM_NAME: Product API CI

      AWS_EC2_METADATA_DISABLED: "true"

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # DOCKER INFORMATION
      # --------------------------------------------------------

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version


      # --------------------------------------------------------
      # BUILD
      # --------------------------------------------------------

      - name: Build FastAPI test image
        run: |
          docker compose build fastapi


      # --------------------------------------------------------
      # REQUIRED DIRECTORIES
      # --------------------------------------------------------

      - name: Create upload directories
        run: |
          mkdir -p uploads/products


      # --------------------------------------------------------
      # START SERVICES
      # --------------------------------------------------------

      - name: Start CI test services
        run: |
          docker compose up -d --no-build fastapi redis postgres_test


      - name: Show running containers
        run: |
          docker compose ps


      # --------------------------------------------------------
      # WAIT FOR POSTGRES
      # --------------------------------------------------------

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for CI PostgreSQL..."

          for attempt in $(seq 1 20); do
            if docker compose exec -T postgres_test \
              pg_isready -U postgres -d product_test_db; then
              echo "CI PostgreSQL is ready."
              exit 0
            fi

            echo "PostgreSQL not ready. Attempt $attempt/20"
            sleep 3
          done

          echo "ERROR: PostgreSQL did not become ready."
          exit 1


      # --------------------------------------------------------
      # WAIT FOR REDIS
      # --------------------------------------------------------

      - name: Wait for Redis
        run: |
          echo "Waiting for CI Redis..."

          for attempt in $(seq 1 20); do
            if docker compose exec -T redis \
              redis-cli ping | grep -q '^PONG$'; then
              echo "CI Redis is ready."
              exit 0
            fi

            echo "Redis not ready. Attempt $attempt/20"
            sleep 2
          done

          echo "ERROR: Redis did not become ready."
          exit 1


      # --------------------------------------------------------
      # ALEMBIC MIGRATIONS
      # --------------------------------------------------------
      - name: Verify CI database target
        run: |
          docker compose exec -T fastapi python -c '
          from app.config import settings
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = make_url(settings.DATABASE_URL)

          if url.host != "postgres_test":
              raise RuntimeError("Unsafe database host")

          if url.database != "product_test_db":
              raise RuntimeError("Unsafe database name")

          engine = create_engine(settings.DATABASE_URL)

          with engine.connect() as connection:
              database = connection.execute(
                  text("SELECT current_database()")
              ).scalar_one()

          if database != "product_test_db":
              raise RuntimeError("Connected to unexpected database")

          print("PASS: Connected to isolated CI test database.")
          '     

      - name: Run migrations
        run: |
          docker compose exec -T fastapi \
            alembic upgrade head


      # --------------------------------------------------------
      # PYTEST + COVERAGE
      # --------------------------------------------------------

      - name: Run tests with coverage
        run: |
          docker compose exec -T fastapi pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=90


      # --------------------------------------------------------
      # DIAGNOSTICS
      # --------------------------------------------------------

      - name: Show logs if CI fails
        if: failure()
        run: |
          docker compose ps
          docker compose logs


      # --------------------------------------------------------
      # CLEANUP
      # --------------------------------------------------------

      - name: Stop CI Docker containers
        if: always()
        run: |
          if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "ERROR: Cleanup is restricted to GitHub-hosted Actions runners."
            exit 1
          fi

          docker compose down --volumes
