name: Product API CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build Docker containers
        run: |
          docker compose build

      - name: Start Docker services
        run: |
          docker compose up -d

      - name: Show running containers
        run: |
          docker compose ps

      - name: Wait for PostgreSQL
        run: |
          until docker compose exec -T postgres pg_isready -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Wait for Redis
        run: |
          until docker compose exec -T redis redis-cli ping | grep PONG; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Create test database
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d postgres \
            -c "CREATE DATABASE product_test_db;" || true

      - name: Run migrations
        run: |
          docker compose exec -T fastapi alembic upgrade head

      - name: Run tests with coverage
        run: |
          docker compose exec -T fastapi pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Show logs if CI fails
        if: failure()
        run: |
          docker compose logs

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v