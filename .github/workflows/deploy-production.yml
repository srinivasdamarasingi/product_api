
name: Product API Production Preflight Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-api-production-validation
  cancel-in-progress: false

jobs:
  production-validation:
    name: Approved Production Preflight
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "211125480708"
      INSTANCE_ID: i-0d177820566200d3e
      SSM_DOCUMENT: ProductApi-ProductionValidation
      SSM_DOCUMENT_VERSION: "1"
      IMAGE_DIGEST: "sha256:413a638fa6ea6cdee88588ef32a30895d7cbb9729b81c541a2eeee169dc41f55"
      IMAGE_GIT_SHA: "12b219f19f14b05dabfd12f92f1b6c165fe6e41c"

    steps:
      - name: Verify approved workflow context
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/master"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

          echo "Approved production environment reached."
          echo "Workflow branch: $GITHUB_REF_NAME"
          echo "Workflow commit: $GITHUB_SHA"
          echo "Execution mode: VALIDATION ONLY"

      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211125480708:role/GitHubActionsProductApiProductionDeploy
          aws-region: us-east-1
          role-session-name: product-api-production-verify

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity \
            --query Account --output text)

          ARN=$(aws sts get-caller-identity \
            --query Arn --output text)

          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"

          case "$ARN" in
            arn:aws:sts::211125480708:assumed-role/GitHubActionsProductApiProductionDeploy/*)
              echo "PASS: Expected AWS role assumed"
              ;;
            *)
              echo "FAIL: Unexpected AWS identity"
              exit 1
              ;;
          esac

      - name: Execute validation-only SSM document
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/product-api@${IMAGE_DIGEST}"

          PARAMETERS=$(jq -n \
            --arg previous "$IMAGE" \
            --arg target "$IMAGE" \
            --arg sha "$IMAGE_GIT_SHA" \
            '{
              PreviousImage: [$previous],
              TargetImage: [$target],
              GitSha: [$sha]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$SSM_DOCUMENT" \
            --document-version "$SSM_DOCUMENT_VERSION" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 120 \
            --query 'Command.CommandId' \
            --output text)

          test -n "$COMMAND_ID"
          test "$COMMAND_ID" != "None"

          echo "SSM command ID: $COMMAND_ID"

          echo "Waiting for validation result..."

          POLL_INTERVAL=5
          MAX_WAIT_SECONDS=420
          DEADLINE=$((SECONDS + MAX_WAIT_SECONDS))
          RESULT=""
          STATUS=""

          while (( SECONDS < DEADLINE )); do
            ERROR_FILE=$(mktemp)

            if RESULT=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --cli-connect-timeout 5 \
              --cli-read-timeout 15 \
              --output json 2>"$ERROR_FILE"); then
              rm -f "$ERROR_FILE"
            else
              ERROR=$(cat "$ERROR_FILE")
              rm -f "$ERROR_FILE"

              if [[ "$ERROR" == *"InvocationDoesNotExist"* ]]; then
                echo "SSM invocation not yet available; retrying."
                sleep "$POLL_INTERVAL"
                continue
              fi

              echo "FAIL: SSM API error"
              echo "$ERROR"
              echo "SSM command ID: $COMMAND_ID"
              exit 1
            fi

            if ! echo "$RESULT" | jq -e . >/dev/null 2>&1; then
              echo "FAIL: Invalid SSM JSON response"
              exit 1
            fi

            if (( SECONDS >= DEADLINE )); then
              echo "FAIL: SSM polling deadline exceeded"
              echo "SSM command ID: $COMMAND_ID"
              exit 1
            fi
            STATUS=$(echo "$RESULT" | jq -r '.Status')
            RESPONSE_CODE=$(echo "$RESULT" | jq -r '.ResponseCode')

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed)
                sleep "$POLL_INTERVAL"
                ;;
              *)
                echo "FAIL: Unexpected SSM status: $STATUS"
                exit 1
                ;;
            esac
          done

          if [[ -z "$RESULT" ]] || ! echo "$RESULT" | jq -e . >/dev/null 2>&1; then
            echo "FAIL: No valid SSM invocation result"
            echo "SSM command ID: $COMMAND_ID"
            exit 1
          fi

          echo "$RESULT" | jq '{
            Status,
            StatusDetails,
            ResponseCode,
            StandardOutputContent,
            StandardErrorContent
          }'

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          RESPONSE_CODE=$(echo "$RESULT" | jq -r '.ResponseCode')

          if (( SECONDS >= DEADLINE )) || [[ "$STATUS" != "Success" || "$RESPONSE_CODE" != "0" ]]; then
            echo "FAIL: Production preflight validation"
            echo "SSM command ID: $COMMAND_ID"
            exit 1
          fi

          echo "PASS: Production preflight validation"
          echo "NO DEPLOYMENT PERFORMED"
