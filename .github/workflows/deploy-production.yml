
name: Product API Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-approval:
    name: Production Approval and AWS Authentication
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify production approval
        run: |
          echo "Production approval completed."
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          url = request_url + "&audience=" + urllib.parse.quote("sts.amazonaws.com")

          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {request_token}"}
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ("iss", "aud", "sub", "repository", "ref", "environment"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211125480708:role/GitHubActionsProductApiProductionDeploy
          aws-region: us-east-1
          role-session-name: product-api-production-verify

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}' \
            --output json
