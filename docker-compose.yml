services:

  postgres:
    image: postgres:17
    container_name: postgres_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SqlPgAdmin
      POSTGRES_DB: product_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: redis_server

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  fastapi:
    build: .
    container_name: product_api

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:SqlPgAdmin@postgres:5432/product_db
      REDIS_HOST: redis

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: .
    container_name: celery_worker

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:SqlPgAdmin@postgres:5432/product_db
      REDIS_HOST: redis

    command: celery -A app.celery_worker.celery worker --loglevel=info
  
  flower:
    build: .
    container_name: flower

    depends_on:
      - redis
      - celery

    ports:
      - "5555:5555"

    command: celery -A app.celery_worker.celery flower --port=5555

volumes:
  postgres_data:
  redis_data:
